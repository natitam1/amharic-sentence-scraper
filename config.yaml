user_agent: "AmharicSentenceResearchBot/1.0 (+mailto:natnaeltamiru98@gmail.com)"

output:
  jsonl_path: data/amharic_sentences.jsonl
  state_db_path: data/scraper_state.sqlite3

http:
  timeout_seconds: 25
  retries: 3
  backoff_seconds: 1.5
  default_delay_seconds: 2.5
  robots:
    enabled: true
    fail_closed: false
    cache_seconds: 86400

filter:
  min_words: 5
  max_words: 90
  min_ethiopic_ratio: 0.55
  require_terminal_punctuation: true
  max_url_email_hashtag_ratio: 0.20
  blocklist:
    - "ተጨማሪ ያንብቡ"
    - "ሙሉውን ያንብቡ"
    - "ኮሜንቶችን ይመልከቱ"
    - "ይመዝገቡ"
    - "subscribe"
    - "copyright"
    - "all rights reserved"
    - "photo:"
    - "image:"

balance:
  max_sentences_per_type: null

dedup:
  similarity_threshold: 0.90
  rolling_window: 5000
  length_bucket_size: 10
  prefix_chars: 8

# Endpoints and selectors are intentionally data-driven. Verify terms and
# robots policy before enabling additional sources.
sources:
  bbc_amharic:
    enabled: true
    adapter: generic_news
    content_type: news
    base_url: "https://www.bbc.com/amharic"
    discovery:
      type: rss
      urls:
        - "https://feeds.bbci.co.uk/amharic/rss.xml"
    article_url_patterns:
      - "/amharic/articles/"
      - "/amharic/news-"
    body_selectors:
      - "main article"
      - "[data-component='text-block']"
      - "article"
    remove_selectors: ["script", "style", "nav", "aside", "footer", "figure", "form"]
    delay_seconds: 2.5

  voa_amharic:
    enabled: true
    adapter: generic_news
    content_type: news
    base_url: "https://amharic.voanews.com"
    discovery:
      type: rss
      urls:
        - "https://amharic.voanews.com/api/zrqiteuuir"
    article_url_patterns: ["/a/"]
    body_selectors:
      - ".wsw"
      - ".article-content"
      - "article"
    remove_selectors: ["script", "style", "nav", "aside", "footer", "figure", "form"]
    delay_seconds: 2.5

  dw_amharic:
    enabled: true
    adapter: generic_news
    content_type: news
    base_url: "https://www.dw.com/am"
    discovery:
      type: rss
      urls:
        - "https://rss.dw.com/rdf/rss-am-all"
    article_url_patterns: ["/am/"]
    body_selectors:
      - "main article"
      - ".rich-text"
      - "article"
    remove_selectors: ["script", "style", "nav", "aside", "footer", "figure", "form"]
    delay_seconds: 2.5

  fana:
    enabled: false
    adapter: generic_news
    content_type: news
    base_url: "https://www.fanabc.com"
    discovery:
      type: sitemap
      urls: ["https://www.fanabc.com/sitemap_index.xml"]
    article_url_patterns: ["/archives/"]
    body_selectors: [".entry-content", "article"]
