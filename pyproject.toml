[project]
name = "amharic-sentence-scraper"
version = "0.1.0"
description = "A polite pipeline for collecting clean Amharic sentences from news sites."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "natitam1"}]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "feedparser>=6.0,<7",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
]

[project.urls]
Repository = "https://github.com/natitam1/amharic-sentence-scraper"
Issues = "https://github.com/natitam1/amharic-sentence-scraper/issues"

[tool.setuptools.packages.find]
include = ["scraper*"]
